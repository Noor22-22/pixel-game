<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Shayan's Work Life</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  background: #000;
  font-family: monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: yellow;
}

/* PIXELATED STYLE */
* { image-rendering: pixelated; }

/* CONTAINER WITHOUT BORDER */
#gameContainer {
  position: relative;
  width: 350px;  
  height: 760px; 
  display: flex;
  justify-content: center;
  align-items: center;
  background: black;
}

/* CANVAS */
canvas {
  background: #000;
  display: block;
  width: 100%;
  height: 100%;
}

/* HUD INSIDE CANVAS */
#overlay {
  position: absolute;
  top: 40px; /* moved down from 10px to 40px */
  left: 10px;
  right: 10px;
  display: flex;
  justify-content: space-between;
  z-index: 5;
  color: white;
  font-size: 14px;
}

#stress {
  width: 100px;
  height: 10px;
  border: 1px solid white;
}

#stressFill {
  height: 100%;
  width: 0%;
  background: red;
}

/* START SCREEN */
#startScreen {
  position: absolute;
  inset: 0;
  background: #000;
  color: yellow;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  z-index: 10;
}

#startButton {
  padding: 12px 25px;
  font-size: 24px;
  font-family: monospace;
  background: #ff0;
  border: none;
  border-radius: 6px;
  color: black;
  cursor: pointer;
  animation: blink 1s infinite;
}

#startScreen h2 {
  font-size: 18px;
  margin-top: 10px;
  color: #0f0;
}

@keyframes blink {
  0%,50%,100% {opacity:1;}
  25%,75% {opacity:0;}
}

/* END SCREEN */
#endScreen {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.95);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  flex-direction: column;
  z-index: 10;
}
#endScreen img { margin-top: 20px; max-width: 60px; height:auto; }
#endScreen button {
  margin-top: 20px;
  padding: 10px 20px;
  font-size: 16px;
  cursor: pointer;
  border-radius: 6px;
  background: #ff0;
  color: black;
  border: none;
}
</style>
</head>
<body>

<!-- START SCREEN -->
<div id="startScreen">
  <button id="startButton">LET'S PLAY</button>
  <h2>Shayan's Work Life</h2>
</div>

<!-- GAME CONTAINER -->
<div id="gameContainer">
  <!-- HUD -->
  <div id="overlay">
    <div>
      Stress
      <div id="stress"><div id="stressFill"></div></div>
    </div>
    <div id="dollar">$0</div>
  </div>
  <canvas id="game"></canvas>
</div>

<!-- END SCREEN -->
<div id="endScreen" style="display:none">
  <h2 id="endMessage"></h2>
  <div id="businessDead"></div>
  <div id="revenue"></div>
  <img id="roseImg" src="images/rose.png" style="display:none">
  <button id="playAgainBtn" style="display:none" onclick="restartGame()">Play Again</button>
</div>

<script>
const VERSION = "v16";

/* INLINE PING SOUND */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playPing(){
  const oscillator = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  oscillator.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  oscillator.type = "square";
  oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
  gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
  oscillator.start();
  oscillator.stop(audioCtx.currentTime + 0.1);
}

/* CANVAS */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = 350;
canvas.height = 760;

/* HERO IMAGE */
const heroImg = new Image();
heroImg.src = "images/hero.png?" + VERSION;

/* GAME STATE */
let hero, bars, stress, totalDollars, gameOver, started;
let spawnTimer = 0;
let spawnDelay = 100;
let dollars = [];

const businessesData = [
  { name: "ProPakistani", color: "#00ffcc" },
  { name: "Eikon7", color: "#ffcc00" },
  { name: "FourthWallStudios", color: "#ff6699" },
  { name: "HDIW Podcast", color: "#66ccff" },
  { name: "Trademor", color: "#99ff66" }
];

const barWidth = 100;
const barHeight = 16;

function initGame() {
  hero = { x: canvas.width/2-20, y: canvas.height-100, w:40, h:40, vx:0, vy:0 };
  bars = [];
  stress = 0;
  totalDollars = 0;
  dollars = [];
  gameOver = false;
  spawnTimer = 0;
  businessesData.forEach(b=>b.money=0);
  document.getElementById("stressFill").style.width = "0%";
  document.getElementById("dollar").innerText = "$0";
  document.getElementById("businessDead").innerHTML = "";
}

/* SPAWN BAR */
function spawnBar() {
  const business = businessesData[Math.floor(Math.random()*businessesData.length)];
  bars.push({ x: Math.random()*(canvas.width-barWidth), y: -30, vy:1.2, business });
}

/* UPDATE */
function update() {
  if(!started || gameOver) return;

  hero.vy += 0.4;
  hero.x += hero.vx;
  hero.y += hero.vy;

  if(hero.y + hero.h > canvas.height-20){ hero.y=canvas.height-20-hero.h; hero.vy=0; }
  if(hero.x<0) hero.x=0;
  if(hero.x+hero.w>canvas.width) hero.x=canvas.width-hero.w;

  spawnTimer++;
  if(spawnTimer>spawnDelay){ spawnBar(); spawnTimer=0; }

  for(let i=bars.length-1;i>=0;i--){
    let bar=bars[i];
    bar.y+=bar.vy;

    // HERO HITS BAR
    if(hero.x < bar.x+barWidth && hero.x+hero.w>bar.x &&
       hero.y + hero.h > bar.y && hero.y < bar.y + barHeight &&
       hero.vy>=0){
      hero.vy=-6;
      bar.business.money++;
      totalDollars++;
      stress++;
      document.getElementById("dollar").innerText="$"+totalDollars;
      document.getElementById("stressFill").style.width=Math.min(stress*10,100)+"%";
      dollars.push({x:bar.x+barWidth/2, y:bar.y, vy:-2, alpha:1});
      playPing();
      bars.splice(i,1);
      continue;
    }

    // BAR FALLS
    if(bar.y>canvas.height) dramaticEnd("barFall", bar.business.name);
  }

  if(stress>=10) dramaticEnd("stress");

  dollars.forEach((d,i)=>{
    d.y+=d.vy; d.alpha-=0.03;
    if(d.alpha<=0) dollars.splice(i,1);
  });
}

/* DRAW */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!started) return;
  ctx.drawImage(heroImg, hero.x, hero.y, hero.w, hero.h);

  bars.forEach(bar=>{
    ctx.fillStyle=bar.business.color;
    ctx.fillRect(bar.x, bar.y, barWidth, barHeight);
    ctx.fillStyle="#000";
    ctx.font="10px monospace";
    ctx.textAlign="center";
    ctx.fillText(bar.business.name, bar.x+barWidth/2, bar.y+12);
  });

  ctx.font="16px monospace";
  ctx.fillStyle="yellow";
  ctx.textAlign="center";
  dollars.forEach(d=>{ ctx.globalAlpha=d.alpha; ctx.fillText("$", d.x, d.y); });
  ctx.globalAlpha=1;
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }

/* END SEQUENCE */
function dramaticEnd(reason, businessName=null){
  if(gameOver) return;
  gameOver=true;
  document.getElementById("overlay").style.display="none";
  const endScreen=document.getElementById("endScreen");
  const endMessage=document.getElementById("endMessage");
  const stressFill=document.getElementById("stressFill");
  const businessDeadDiv=document.getElementById("businessDead");
  endScreen.style.display="flex";
  stressFill.style.width="100%";

  // Main heading
  endMessage.innerText="Stress Alert!";
  endMessage.style.color="red";
  endMessage.style.fontSize="28px";

  // Business death message
  businessDeadDiv.innerHTML = "";
  if(businessName){
    let p = document.createElement("p");
    p.innerText=`${businessName} is dead!`;
    p.style.color="#ff4444";
    businessDeadDiv.appendChild(p);
  }

  // Danger siren
  const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  function playSiren(){
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type="square";
    osc.frequency.setValueAtTime(800,audioCtx.currentTime);
    gain.gain.setValueAtTime(0.3,audioCtx.currentTime);
    osc.start(); osc.stop(audioCtx.currentTime+0.15);
  }

  // Blink stress bar + message 3 times
  let blinkCount=0;
  const maxBlinks=6; // 3 cycles
  const blinkInterval=setInterval(()=>{
    const isRed=blinkCount%2===0;
    stressFill.style.backgroundColor=isRed?"red":"white";
    endMessage.style.color=isRed?"red":"white";
    playSiren();
    blinkCount++;
    if(blinkCount>maxBlinks){
      clearInterval(blinkInterval);
      // SHOW FINAL RESULTS
      let revenueDiv=document.getElementById("revenue");
      revenueDiv.innerHTML=`<h3>Total Revenue: $${totalDollars}</h3>`;
      businessesData.forEach(b=>revenueDiv.innerHTML+=`<p>${b.name}: $${b.money}</p>`);
      document.getElementById("roseImg").style.display="block";
      document.getElementById("playAgainBtn").style.display="block";
    }
  },500);
}

/* RESTART */
function restartGame(){
  document.getElementById("endScreen").style.display="none";
  document.getElementById("overlay").style.display="flex";
  document.getElementById("playAgainBtn").style.display="none";
  document.getElementById("roseImg").style.display="none";
  initGame();
}

/* TOUCH CONTROLS */
let touchStartX=0;
canvas.addEventListener("touchstart",e=>{ if(!started) return; touchStartX=e.touches[0].clientX; hero.vy=-6; });
canvas.addEventListener("touchmove",e=>{ if(!started) return; hero.vx=(e.touches[0].clientX-touchStartX)*0.04; });
canvas.addEventListener("touchend",()=>{ hero.vx=0; });

/* KEYBOARD */
document.addEventListener("keydown",e=>{if(!started||gameOver) return;
if(e.key==="ArrowLeft") hero.vx=-3;
if(e.key==="ArrowRight") hero.vx=3;
if(e.key===" ") hero.vy=-6;});
document.addEventListener("keyup",e=>{if(e.key==="ArrowLeft"||e.key==="ArrowRight") hero.vx=0;});

/* START BUTTON */
document.getElementById("startButton").addEventListener("click",()=>{
  started=true;
  document.getElementById("startScreen").style.display="none";
  document.getElementById("overlay").style.display="flex";
  initGame();
});

loop();
</script>
</body>
</html>
