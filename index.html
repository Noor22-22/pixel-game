<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Pixel Goal Game</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: #0b1020;
    font-family: "Courier New", monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #e5e7eb;
  }

  .game {
    width: 320px;
    background: #111827;
    border: 4px solid #38bdf8;
    padding: 20px;
    text-align: center;
    box-shadow: 0 0 0 4px #000;
  }

  h1 {
    font-size: 18px;
    margin-bottom: 10px;
    letter-spacing: 1px;
  }

  /* ===== PIXEL CHARACTER ===== */
  .character {
    width: 64px;
    height: 64px;
    margin: 0 auto 12px;
    image-rendering: pixelated;
    animation: idle 1.4s steps(2) infinite;
  }

  .pixel {
    width: 8px;
    height: 8px;
    float: left;
  }

  @keyframes idle {
    0% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
    100% { transform: translateY(0); }
  }

  /* ===== GAME UI ===== */
  .counter {
    font-size: 12px;
    margin-bottom: 8px;
  }

  .goal {
    height: 14px;
    background: #020617;
    border: 2px solid #22c55e;
    margin-bottom: 12px;
  }

  .fill {
    height: 100%;
    width: 0%;
    background: #22c55e;
    transition: width 0.3s steps(5);
  }

  .pixel-btn {
    padding: 14px;
    background: #38bdf8;
    color: #022c22;
    border: none;
    font-size: 14px;
    cursor: pointer;
    width: 100%;
    box-shadow: 4px 4px 0 #000, -4px -4px 0 #0ea5e9;
    animation: pulse 1.4s infinite;
  }

  .pixel-btn:active {
    transform: translate(4px, 4px);
    box-shadow: 0 0 0 #000;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  .message {
    display: none;
    margin-top: 16px;
    font-size: 14px;
    color: #a5f3fc;
    animation: pop 0.6s steps(3);
  }

  @keyframes pop {
    0% { transform: scale(0); }
    80% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  .clear { clear: both; }
</style>
</head>

<body>
<div class="game">
  <h1>SCORE 5 GOALS ⚽</h1>

  <!-- PIXEL BOY CHARACTER -->
  <div class="character">
    <!-- Hair -->
    <div class="pixel" style="background:#1f2937"></div>
    <div class="pixel" style="background:#1f2937"></div>
    <div class="pixel" style="background:#1f2937"></div>
    <div class="pixel" style="background:#1f2937"></div>
    <div class="pixel" style="background:#1f2937"></div>
    <div class="pixel" style="background:#1f2937"></div>
    <div class="pixel" style="background:#1f2937"></div>
    <div class="pixel" style="background:#1f2937"></div>

    <!-- Face -->
    <div class="pixel" style="background:#fcd7b6"></div>
    <div class="pixel" style="background:#fcd7b6"></div>
    <div class="pixel" style="background:#000"></div>
    <div class="pixel" style="background:#fcd7b6"></div>
    <div class="pixel" style="background:#fcd7b6"></div>
    <div class="pixel" style="background:#000"></div>
    <div class="pixel" style="background:#fcd7b6"></div>
    <div class="pixel" style="background:#fcd7b6"></div>

    <!-- Shirt -->
    <div class="pixel" style="background:#38bdf8"></div>
    <div class="pixel" style="background:#38bdf8"></div>
    <div class="pixel" style="background:#38bdf8"></div>
    <div class="pixel" style="background:#38bdf8"></div>
    <div class="pixel" style="background:#38bdf8"></div>
    <div class="pixel" style="background:#38bdf8"></div>
    <div class="pixel" style="background:#38bdf8"></div>
    <div class="pixel" style="background:#38bdf8"></div>

    <!-- Legs -->
    <div class="pixel" style="background:#020617"></div>
    <div class="pixel" style="background:#020617"></div>
    <div class="pixel" style="background:#020617"></div>
    <div class="pixel" style="background:#020617"></div>
    <div class="pixel" style="background:#020617"></div>
    <div class="pixel" style="background:#020617"></div>
    <div class="pixel" style="background:#020617"></div>
    <div class="pixel" style="background:#020617"></div>

    <div class="clear"></div>
  </div>

  <div class="counter" id="counter">Goals: 0 / 5</div>

  <div class="goal">
    <div class="fill" id="fill"></div>
  </div>

  <button class="pixel-btn" onclick="kick()">KICK!</button>

  <div class="message" id="message">
    <strong>
      Btw, I was joking about the palmistry thing ;p  
      <br>It’s just fun!
    </strong>
  </div>
</div>

<script>
  let goals = 0;
  const maxGoals = 5;

  function kick() {
    goals++;
    document.getElementById("counter").innerText =
      `Goals: ${goals} / ${maxGoals}`;
    document.getElementById("fill").style.width =
      (goals / maxGoals) * 100 + "%";

    if (goals >= maxGoals) {
      document.querySelector(".pixel-btn").style.display = "none";
      document.getElementById("message").style.display = "block";
    }
  }
</script>
</body>
</html>
