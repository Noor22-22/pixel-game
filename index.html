<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Pixel Unlock</title>

<style>
  /* ---------- BASE ---------- */
  body {
    margin: 0;
    height: 100vh;
    background: #0b1020;
    font-family: 'Courier New', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e5e7eb;
  }

  .game {
    width: 280px;
    background: #111827;
    border: 4px solid #38bdf8;
    padding: 20px;
    box-shadow: 0 0 0 4px #000;
    text-align: center;
  }

  h1 {
    font-size: 18px;
    margin-bottom: 10px;
    letter-spacing: 1px;
  }

  p {
    font-size: 12px;
    margin: 6px 0;
  }

  /* ---------- PIXEL BUTTON ---------- */
  .pixel-btn {
    margin-top: 20px;
    padding: 16px;
    background: #22c55e;
    color: #022c22;
    border: none;
    font-size: 14px;
    cursor: pointer;
    width: 100%;
    font-family: inherit;
    box-shadow:
      4px 4px 0 #000,
      -4px -4px 0 #16a34a;
    animation: pulse 1.5s infinite;
  }

  .pixel-btn:active {
    transform: translate(4px, 4px);
    box-shadow:
      0 0 0 #000,
      0 0 0 #16a34a;
  }

  /* ---------- PROGRESS BAR ---------- */
  .bar {
    margin-top: 15px;
    height: 12px;
    background: #020617;
    border: 2px solid #38bdf8;
  }

  .fill {
    height: 100%;
    width: 0%;
    background: #38bdf8;
    transition: width 0.3s steps(5);
  }

  /* ---------- MESSAGE ---------- */
  .message {
    display: none;
    margin-top: 20px;
    font-size: 14px;
    animation: pop 0.6s steps(3);
    color: #a5f3fc;
  }

  /* ---------- ANIMATIONS ---------- */
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  @keyframes pop {
    0% { transform: scale(0); }
    80% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  .shake {
    animation: shake 0.3s steps(2);
  }

  @keyframes shake {
    0% { transform: translate(0); }
    25% { transform: translate(-2px, 2px); }
    50% { transform: translate(2px, -2px); }
    75% { transform: translate(-2px, -2px); }
    100% { transform: translate(0); }
  }
</style>
</head>

<body>

<div class="game" id="game">
  <h1>PIXEL UNLOCK</h1>
  <p>Tap the button 5 times</p>

  <button class="pixel-btn" onclick="tap()">TAP</button>

  <div class="bar">
    <div class="fill" id="fill"></div>
  </div>

<div class="message" id="message">
  <strong>Not coming office today? </strong>
</div>


<script>
  let taps = 0;
  const maxTaps = 5;

  function tap() {
    taps++;

    const percent = (taps / maxTaps) * 100;
    document.getElementById("fill").style.width = percent + "%";

    const game = document.getElementById("game");
    game.classList.add("shake");

    setTimeout(() => game.classList.remove("shake"), 300);

    if (taps >= maxTaps) {
      document.querySelector(".pixel-btn").style.display = "none";
      document.getElementById("message").style.display = "block";
    }
  }
</script>
