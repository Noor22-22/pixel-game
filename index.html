<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Shayan's Work Life</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #111;
  font-family: monospace;
}

canvas {
  display: block;
  background: #1e1e1e;
}

/* SCREENS */
#startScreen, #endScreen {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.95);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  flex-direction: column;
  z-index: 10;
}

/* HUD */
#overlay {
  position: absolute;
  top: 10px;
  left: 10px;
  right: 10px;
  display: none;
  justify-content: space-between;
  color: white;
  font-size: 14px;
  z-index: 5;
}

#stress {
  width: 120px;
  height: 10px;
  border: 1px solid white;
}

#stressFill {
  height: 100%;
  width: 0%;
  background: red;
}

button {
  margin-top: 20px;
  padding: 10px 20px;
  font-family: monospace;
}
</style>
</head>

<body>

<!-- START -->
<div id="startScreen">
  <h1>LET’S PLAY</h1>
  <h2>Shayan’s Work Life</h2>
  <p>Tap anywhere to start</p>
</div>

<!-- HUD -->
<div id="overlay">
  <div>
    Stress
    <div id="stress"><div id="stressFill"></div></div>
  </div>
  <div id="dollar">$0</div>
</div>

<canvas id="game"></canvas>

<!-- END -->
<div id="endScreen" style="display:none">
  <h2 id="endMessage"></h2>
  <div id="revenue"></div>
  <img src="images/rose.png" width="90">
  <button onclick="restartGame()">Play Again</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

/* GROUND */
const groundOffset = 90;
let groundY;

/* HERO */
const heroImg = new Image();
heroImg.src = "images/hero.png";

/* GAME STATE */
let hero, bars, stress, totalDollars, gameOver, started;
let spawnTimer = 0;
let spawnDelay = 120; // frames (~2 seconds)

/* BUSINESSES */
const businessesData = [
  { name: "ProPakistani", color: "#00ffcc" },
  { name: "Eikon7", color: "#ffcc00" },
  { name: "FourthWallStudios", color: "#ff6699" },
  { name: "HDIW Podcast", color: "#66ccff" },
  { name: "Trademor", color: "#99ff66" }
];

const barWidth = 120;
const barHeight = 14;

/* INIT */
function initGame() {
  groundY = canvas.height - groundOffset;

  hero = {
    x: canvas.width / 2 - 20,
    y: groundY - 40,
    w: 40,
    h: 40,
    vx: 0,
    vy: 0
  };

  bars = [];
  stress = 0;
  totalDollars = 0;
  gameOver = false;
  spawnTimer = 0;

  businessesData.forEach(b => b.money = 0);

  document.getElementById("stressFill").style.width = "0%";
  document.getElementById("dollar").innerText = "$0";
}

/* SPAWN BAR */
function spawnBar() {
  const business = businessesData[Math.floor(Math.random() * businessesData.length)];

  bars.push({
    x: Math.random() * (canvas.width - barWidth),
    y: -30,
    vy: 1.2,
    angle: (Math.random() * 0.3) - 0.15,
    business
  });
}

/* UPDATE */
function update() {
  if (!started || gameOver) return;

  /* HERO */
  hero.vy += 0.6;
  hero.x += hero.vx;
  hero.y += hero.vy;

  if (hero.y + hero.h > groundY) {
    hero.y = groundY - hero.h;
    hero.vy = 0;
  }

  if (hero.x < 0) hero.x = 0;
  if (hero.x + hero.w > canvas.width)
    hero.x = canvas.width - hero.w;

  /* BAR SPAWN TIMER */
  spawnTimer++;
  if (spawnTimer > spawnDelay) {
    spawnBar();
    spawnTimer = 0;
    spawnDelay = Math.max(70, spawnDelay - 3); // difficulty ramp
  }

  /* BARS */
  bars.forEach((bar, index) => {
    bar.y += bar.vy;

    // Collision
    if (
      hero.x < bar.x + barWidth &&
      hero.x + hero.w > bar.x &&
      hero.y + hero.h > bar.y &&
      hero.y + hero.h < bar.y + barHeight + 8 &&
      hero.vy >= 0
    ) {
      hero.vy = -12;
      bar.y -= 20;

      bar.business.money++;
      totalDollars++;
      stress++;

      document.getElementById("dollar").innerText = "$" + totalDollars;
      document.getElementById("stressFill").style.width =
        Math.min(stress * 10, 100) + "%";
    }

    // Bar fell = game over
    if (bar.y > canvas.height) {
      endGame(bar.business.name + " is dead");
    }
  });

  if (stress >= 10) {
    endGame("Burnout! It’s time for rest!");
  }
}

/* DRAW */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!started) return;

  /* HERO */
  ctx.drawImage(heroImg, hero.x, hero.y, hero.w, hero.h);

  /* BARS */
  bars.forEach(bar => {
    ctx.save();
    ctx.translate(bar.x + barWidth / 2, bar.y + barHeight / 2);
    ctx.rotate(bar.angle);

    ctx.fillStyle = bar.business.color;
    ctx.fillRect(-barWidth / 2, -barHeight / 2, barWidth, barHeight);

    // Text
    ctx.fillStyle = "#000";
    ctx.font = "10px monospace";
    ctx.textAlign = "center";
    ctx.fillText(bar.business.name, 0, 4);

    ctx.restore();
  });
}

/* LOOP */
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

/* END GAME */
function endGame(message) {
  gameOver = true;
  document.getElementById("endScreen").style.display = "flex";
  document.getElementById("endMessage").innerText = message;

  let html = `<h3>Total Revenue: $${totalDollars}</h3>`;
  businessesData.forEach(b => {
    html += `<p>${b.name}: $${b.money}</p>`;
  });
  document.getElementById("revenue").innerHTML = html;
}

/* RESTART */
function restartGame() {
  document.getElementById("endScreen").style.display = "none";
  initGame();
}

/* TOUCH */
let touchStartX = 0;

canvas.addEventListener("touchstart", e => {
  if (!started) return;
  touchStartX = e.touches[0].clientX;
  hero.vy = -12;
});

canvas.addEventListener("touchmove", e => {
  if (!started) return;
  hero.vx = (e.touches[0].clientX - touchStartX) * 0.05;
});

canvas.addEventListener("touchend", () => {
  hero.vx = 0;
});

/* START */
document.getElementById("startScreen").addEventListener("click", () => {
  started = true;
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("overlay").style.display = "flex";
  initGame();
});

loop();
</script>

</body>
</html>
