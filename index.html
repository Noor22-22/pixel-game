<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Founder Frenzy - Pixel Style</title>
<style>
body {
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:#000;
  font-family:'Courier New', monospace;
}

.game {
  width:360px;
  height:640px;
  position:relative;
  overflow:hidden;
  image-rendering:pixelated;
  background:#000;
  border:4px solid #fff;
  background-image: url('images/background.png'); /* pixelated background */
  background-size: cover;
  background-repeat: no-repeat;
}

/* HERO */
.hero {
  width:48px;
  height:48px;
  position:absolute;
  bottom:50px;
  left:156px;
  z-index:3;
  image-rendering:pixelated;
}

/* Horizontal bars */
.bar {
  position:absolute;
  height:12px;
  width:140px;
  text-align:center;
  font-size:8px;
  font-family:'Courier New', monospace;
  line-height:12px;
  color:#fff;
  z-index:2;
  border:1px solid #000;
  image-rendering:pixelated;
  border-radius:2px;
}

/* Treasure $ */
.treasure {
  position:absolute;
  top:10px;
  right:10px;
  font-size:28px;
  color:#0f0;
  z-index:5;
  font-family:'Courier New', monospace;
}

/* Stress bar */
.stress-bar {
  position:absolute;
  top:10px;
  left:10px;
  width:120px;
  height:12px;
  background:#222;
  border:1px solid #fff;
  z-index:5;
}
.stress-fill {
  height:100%;
  width:0%;
  background:#ef4444;
}

/* Dollar flying sign */
.dollar {
  position:absolute;
  font-size:16px;
  font-weight:bold;
  color:#0f0;
  z-index:4;
  pointer-events:none;
  image-rendering:pixelated;
}

/* Welcome overlay */
.welcome {
  position:absolute;
  inset:0;
  background: rgba(0,0,0,0.8);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:#fff;
  font-size:18px;
  text-align:center;
  z-index:6;
}
.start-btn {
  margin-top:15px;
  padding:8px 16px;
  font-size:14px;
  cursor:pointer;
  background:#22c55e;
  border:none;
  color:#022c22;
  font-family:inherit;
}

/* Summary / End screen */
.summary {
  position:absolute;
  inset:0;
  background: rgba(0,0,0,0.85);
  color:#fff;
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-size:12px;
  text-align:center;
  z-index:6;
  padding:10px;
}

.reply-btn {
  margin-top:10px;
  padding:6px 12px;
  font-size:14px;
  cursor:pointer;
  background:#38bdf8;
  color:#000;
  border:none;
  font-family:inherit;
}
</style>
</head>
<body>

<div class="game" id="game">
  <img src="images/hero.png" class="hero" id="hero">

  <!-- Big dollar sign -->
  <div class="treasure" id="treasure">$</div>

  <div class="stress-bar"><div class="stress-fill" id="stressFill"></div></div>

  <!-- Welcome message -->
  <div class="welcome" id="welcome">
    <div style="
      font-family: 'Courier New', monospace;
      font-size: 18px;
      font-weight: bold;
      color: #ff9900;
      text-shadow: 2px 2px #000, 4px 4px #ff5500;
      letter-spacing: 1px;
      text-align: center;
    ">
      Let’s Play<br>Shayan’s Work Life
    </div>
    <button class="start-btn" onclick="startGame()">Start</button>
  </div>

  <div class="summary" id="summary"></div>

  <!-- Sounds -->
  <audio id="hitSound" src="sounds/hit.mp3"></audio>
  <audio id="chaChing" src="sounds/chaching.mp3"></audio>
  <audio id="bgMusic" src="sounds/bg-music.mp3" loop></audio>
</div>

<script>
const game = document.getElementById("game");
const hero = document.getElementById("hero");
const stressFill = document.getElementById("stressFill");
const welcome = document.getElementById("welcome");
const summary = document.getElementById("summary");
const treasure = document.getElementById("treasure");

let heroX=156, heroY=50, velocityY=0, isJumping=false;
const gravity=0.8;
const heroWidth=48, heroHeight=48;

let stress=0, maxStress=10;
let gameOver=false;

const companies = [
  {name:"EIKON7", color:"#ff0000", revenue:0},
  {name:"PROPAKISTANI", color:"#00ff00", revenue:0},
  {name:"HDIW PODCAST", color:"#ffff00", revenue:0},
  {name:"TRADEMOR", color:"#8b4513", revenue:0},
  {name:"FOURTHWALL", color:"#ff00ff", revenue:0}
];

document.addEventListener("keydown", e=>{
  if(gameOver) return;
  if(e.key==="ArrowRight") heroX = Math.min(heroX+10, 360-heroWidth);
  if(e.key==="ArrowLeft") heroX = Math.max(heroX-10, 0);
  if(e.key===" " && !isJumping){ velocityY=15; isJumping=true; }
});

function startGame(){
  welcome.style.display="none";
  requestAnimationFrame(updateHero);
  spawnLoop();
  document.getElementById("bgMusic").play();
}

function spawnLoop(){
  if(gameOver) return;
  const company = companies[Math.floor(Math.random()*companies.length)];
  spawnBar(company);
  setTimeout(spawnLoop, 1200);
}

function spawnBar(info){
  const bar = document.createElement("div");
  bar.className="bar";
  bar.style.background = info.color;
  bar.style.left = Math.random()*(360-140)+"px";
  bar.style.top = "-12px";
  bar.innerText = info.name;
  game.appendChild(bar);

  let y=-12;
  function moveBar(){
    if(gameOver) return;
    y+=4;
    bar.style.top = y+"px";

    const heroRect = hero.getBoundingClientRect();
    const barRect = bar.getBoundingClientRect();
    const gameRect = game.getBoundingClientRect();

    const heroTop = heroRect.top - gameRect.top;
    const heroBottom = heroTop + heroHeight;
    const heroLeft = heroRect.left - gameRect.left;
    const heroRight = heroLeft + heroWidth;

    const barTop = barRect.top - gameRect.top;
    const barBottom = barTop + 12;
    const barLeft = barRect.left - gameRect.left;
    const barRight = barLeft + 140;

    // collision
    if(heroBottom >= barTop && heroTop <= barBottom && heroRight>barLeft && heroLeft<barRight){
      info.revenue++;
      stress++;
      stressFill.style.width = (stress/maxStress*100)+"%";
      document.getElementById("chaChing").play();

      const treasureRect = treasure.getBoundingClientRect();
      const dollar = document.createElement("div");
      dollar.className="dollar";
      dollar.style.left = (barLeft+50)+"px";
      dollar.style.top = barTop+"px";
      dollar.innerText="$";
      game.appendChild(dollar);

      const startX = barLeft+50;
      const startY = barTop;
      const endX = treasureRect.left - gameRect.left + 5;
      const endY = treasureRect.top - gameRect.top + 5;
      const duration = 600;
      let startTime=null;
      function animateDollar(timestamp){
        if(!startTime) startTime=timestamp;
        const progress = (timestamp-startTime)/duration;
        if(progress<1){
          dollar.style.left = startX + (endX-startX)*progress + "px";
          dollar.style.top = startY + (endY-startY)*progress + "px";
          requestAnimationFrame(animateDollar);
        } else {
          dollar.remove();
        }
      }
      requestAnimationFrame(animateDollar);

      bar.remove();
      if(stress>=maxStress) endGame("Take a Rest!");
      return;
    }

    if(y>640){
      bar.remove();
      endGame(null, info.name); // business dead
      return;
    }

    requestAnimationFrame(moveBar);
  }
  requestAnimationFrame(moveBar);
}

// HERO PHYSICS
function updateHero(){
  if(gameOver) return;
  velocityY -= gravity;
  heroY += velocityY;
  if(heroY<=50){ heroY=50; velocityY=0; isJumping=false; }
  hero.style.left = heroX + "px";
  hero.style.bottom = heroY + "px";
  requestAnimationFrame(updateHero);
}

// END GAME
function endGame(msg, deadBusiness=null){
  gameOver = true;
  summary.style.display = "flex";

  let revenueText = "";
  companies.forEach(c => {
    revenueText += `${c.name}: $${c.revenue} <br>`;
  });

  let displayMsg = msg ? msg : `${deadBusiness} is Dead!`;

  summary.innerHTML = `
    <div style="
      font-family: 'Courier New', monospace;
      font-size: 16px;
      font-weight: bold;
      color: #ff6600;
      text-shadow: 2px 2px #000, 4px 4px #ff3300;
      text-align: center;
      margin-bottom: 10px;
    ">
      ${displayMsg}
    </div>
    <div style="
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #fff;
      text-align: center;
      margin-bottom: 8px;
    ">
      Stress: ${stress}
    </div>
    <div style="
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #fff;
      text-align: center;
      margin-bottom: 8px;
    ">
      Revenue Collected: <br> ${revenueText}
    </div>
    <div style="
      font-family: 'Courier New', monospace;
      font-size: 14px;
      color: #ffcc00;
      text-align: center;
      margin-bottom: 10px;
    ">
      🌹
    </div>
    <button class="reply-btn" onclick="location.reload()">Play Again!</button>
  `;
}
</script>
</body>
</html>
